<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181817" />
    <title>AETHER-OS</title>
    <script>
      // Apply the persisted theme, accent and density before first paint so
      // the window never flashes the wrong colors. Mirrors src/lib/theme.ts
      // and src/lib/appearance.ts.
      (function () {
        var root = document.documentElement;
        var get = function (k) {
          try { return window.localStorage.getItem(k); } catch (e) { return null; }
        };
        var pref = get("aether-theme");
        var dark = true;
        if (pref === "light") dark = false;
        else if (pref !== "dark" && window.matchMedia) dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.style.colorScheme = dark ? "dark" : "light";
        var accent = get("aether-accent");
        root.setAttribute("data-accent", /^(teal|ember|cobalt|graphite)$/.test(accent || "") ? accent : "teal");
        root.setAttribute("data-density", get("aether-density") === "compact" ? "compact" : "comfortable");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
