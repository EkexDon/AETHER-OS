[package]
name = "aether-core"
version = "0.2.0"
description = "AETHER-OS local-first cognitive workspace"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aether_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "1.0"
futures-util = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "=0.4.38", features = ["serde"] }
hex = "0.4"
icalendar = "0.7"
walkdir = "2.4"
regex = "1.10"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-notification = "2"
portable-pty = "0.8"
sysinfo = "0.31"
url = "2"
scraper = "0.21"
git2 = "0.21.0"
base64 = "0.22"

# ── Shared integration dependencies (SWARM-CONTRACT §3) ──────────────
# Feature agents add their crates directly above their own anchor.
# Shared crates used by several features live under `deps:shared`.
# @anchor:deps:shared
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
# @anchor:deps:clipboard
ignore = "0.4"
plist = "1"
tauri-plugin-global-shortcut = "2"
# @anchor:deps:search
notify = "7"
notify-debouncer-mini = "0.5"
# @anchor:deps:history
# @anchor:deps:home
# @anchor:deps:vaulttasks
# @anchor:deps:intel
# @anchor:deps:plugins
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
zip = "2"
# @anchor:deps:export
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
blake3 = "1"
rand = "0.8"
zeroize = "1"
# @anchor:deps:sync
# @anchor:deps:onboarding

# Unix-only: process groups for agent commands (`intel/shell_exec.rs`) and
# the login shell lookup (`shell_env.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
